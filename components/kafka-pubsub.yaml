apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kafka-pubsub
spec:
  type: pubsub.kafka
  version: v1
  metadata:
    - name: brokers
      value: "localhost:29092"
    - name: consumerGroup
      value: "payment-processing-uc7-group"
    - name: clientID
      value: "payment-kafka-consumer-service"
    - name: authType
      value: "none"
    - name: disableTls
      value: "true"
    - name: initialOffset
      value: "oldest"
scopes:
  - payment-kafka-consumer-service